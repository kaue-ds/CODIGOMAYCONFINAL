      const INITIAL_DATA = {

      // --- 2. SERVICIOS (STORAGE & AUTH) ---

      const loginUser = async (username, password) => {
        try {
          const { data, error } = await supabase
            .from('users')
            .select('data')
            .eq('data->>username', username)
            .single();

          if (error || !data) {
            // Admin Fallback Hardcoded
            if (username === 'MayconD' && password === '24042017') {
              const admin = { id: 'admin-1', username: 'MayconD', password: '24042017', role: 'admin', name: 'Administrador Principal' };
              await createUser(admin, admin); 
              localStorage.setItem(SESSION_KEY, JSON.stringify(admin));
              return admin;
            }
            return null;
          }

          const user = data.data;
          if (user.password === password) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(user));
            await addLog(user.username, 'LOGIN', 'Usuário entrou no sistema (Online)');
            return user;
          }
        } catch (err) {
          console.error("Login error", err);
        }
        return null;
      };

      const logoutUser = () => {
        const session = getCurrentUser();
        if (session) addLog(session.username, 'LOGOUT', 'Usuário saiu do sistema');
        localStorage.removeItem(SESSION_KEY);
      };

      const getCurrentUser = () => {
        const session = localStorage.getItem(SESSION_KEY);
        return session ? JSON.parse(session) : null;
      };

      const changePassword = async (user, oldPass, newPass) => {
        try {
          const { data: userData, error } = await supabase.from('users').select('*').eq('id', user.id).single();
          if (error || !userData) return { success: false, message: 'Usuário não encontrado.' };

          const currentUserData = userData.data;
          if (currentUserData.password !== oldPass) return { success: false, message: 'Senha atual incorreta.' };

          const updatedUser = { ...currentUserData, password: newPass };
          const { error: updateError } = await supabase.from('users').update({ data: updatedUser }).eq('id', user.id);
          if (updateError) throw updateError;

          const currentSession = getCurrentUser();
          if (currentSession && currentSession.id === user.id) {
            currentSession.password = newPass;
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
          }

          await addLog(user.username, 'ALTERAR_SENHA', 'Usuário alterou sua própria senha');
          return { success: true, message: 'Senha alterada com sucesso!' };
        } catch (e) {
          return { success: false, message: 'Erro de conexão: ' + e.message };
        }
      };

      const saveInspection = async (data, user) => {
        // 1. Save locally FIRST (Backup)
        try {
          const localKey = `backup_insp_${data.id || 'new'}`;
          localStorage.setItem(localKey, JSON.stringify({...data, savedBy: user.username, date: new Date().toISOString()}));
        } catch(e) { console.error("Local backup failed", e); }

        // 2. Try Online
        try {
          if (data.id) {
            const originalDate = new Date(data.date || new Date().toISOString());
            const diffHours = (new Date().getTime() - originalDate.getTime()) / (1000 * 60 * 60);
            if (diffHours > 1) throw new Error("Tempo limite de edição (1 hora) expirado.");
          }

          const id = data.id || crypto.randomUUID();
          const date = data.date || new Date().toISOString();
          
          const inspectionToSave = { ...data, id, date, savedBy: user.username };

          const { error } = await supabase.from('inspections').upsert({
            id: id,
            data: inspectionToSave,
            created_at: date
          });

          if (error) throw error;
          await addLog(user.username, data.id ? 'VISTORIA_ATUALIZADA' : 'VISTORIA_SALVA', `Vistoria placa ${data.plate}`);
          
          // Clear backup on success
          localStorage.removeItem(`backup_insp_${id}`);
          
          return inspectionToSave;
        } catch (e) {
          throw new Error(e.message || "Erro ao salvar na nuvem.");
        }
      };

      const getInspections = async () => {
        try {
          const { data, error } = await supabase.from('inspections').select('data').order('created_at', { ascending: false });
          if (error) throw error;
          return data.map(row => row.data);
        } catch (e) { return []; }
      };

      const getUserInspections = async (username) => {
        try {
          const { data, error } = await supabase.from('inspections').select('data').eq('data->>savedBy', username).order('created_at', { ascending: false });
          if (error) throw error;
          return data.map(row => row.data);
        } catch (e) { return []; }
      };

      const deleteInspection = async (adminUser, inspectionId) => {
        if (adminUser.role !== 'admin') return false;
        try {
          const { error } = await supabase.from('inspections').delete().eq('id', inspectionId);
          if (error) throw error;
          await addLog(adminUser.username, 'DELETAR_VISTORIA', `Deletou vistoria ID: ${inspectionId.substring(0,8)}`);
          return true;
        } catch (e) { return false; }
      };

      const getUsers = async () => {
        try {
          const { data, error } = await supabase.from('users').select('data');
          if (error) throw error;
          return data.map(row => row.data);
        } catch (e) { return []; }
      };

      const createUser = async (adminUser, newUser) => {
        if (adminUser.role !== 'admin' && adminUser.id !== newUser.id) return false;
        try {
          const { data: existing } = await supabase.from('users').select('id').eq('data->>username', newUser.username).single();
          if (existing) return false;

          const { error } = await supabase.from('users').insert({ id: newUser.id, data: newUser });
          if (error) throw error;

          if (adminUser.id !== newUser.id) await addLog(adminUser.username, 'CRIAR_USUARIO', `Criou usuário: ${newUser.username}`);
          return true;
        } catch (e) { return false; }
      };

      const deleteUser = async (adminUser, targetUserId) => {
        if (adminUser.role !== 'admin') return false;
        try {
          const { data: userRow } = await supabase.from('users').select('data').eq('id', targetUserId).single();
          if (!userRow) return false;
          const targetUser = userRow.data;

          if (targetUser.username === 'MayconD' || targetUserId === adminUser.id) return false;

          const { error } = await supabase.from('users').delete().eq('id', targetUserId);
          if (error) throw error;

          await addLog(adminUser.username, 'DELETAR_USUARIO', `Deletou usuário: ${targetUser.username}`);
          return true;
        } catch (e) { return false; }
      };

      const addLog = async (username, action, details) => {
        try {
          const newLog = { id: crypto.randomUUID(), timestamp: new Date().toISOString(), username, action, details };
          await supabase.from('logs').insert({ id: newLog.id, data: newLog });
        } catch (e) { console.error(e); }
      };

          if (error) throw error;
          return data.map(row => row.data);
        } catch (e) { return []; }
      };

      // --- 3. UTILS - PDF GENERATOR ---
      const generateGlobalPDF = (insp) => {

            <!-- Checklist & Tires -->

                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 9px; margin-top: 5px;">
                     ${Object.entries(insp.checklist).map(([k,v]) => `

      // --- 4. COMPONENTES ---

      // Componente: SignaturePad
      const SignaturePad = ({ label, onSave, initialData }) => {
        const canvasRef = useRef(null);
        const [isDrawing, setIsDrawing] = useState(false);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (canvas) {
            canvas.width = canvas.offsetWidth;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';
            if (initialData) {
              const img = new Image();
              img.onload = () => ctx.drawImage(img, 0, 0);
              img.src = initialData;
            }
          }
        }, []);

        const getCoordinates = (event) => {
          const canvas = canvasRef.current;
          if (!canvas) return { x: 0, y: 0 };
          const rect = canvas.getBoundingClientRect();
          let clientX, clientY;
          if ('touches' in event) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
          } else {
            clientX = event.clientX;
            clientY = event.clientY;
          }
          return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const startDrawing = (e) => {
          e.preventDefault();
          setIsDrawing(true);
          const { x, y } = getCoordinates(e);
          const ctx = canvasRef.current?.getContext('2d');
          ctx?.beginPath();
          ctx?.moveTo(x, y);
        };

        const draw = (e) => {
          e.preventDefault();
          if (!isDrawing) return;
          const { x, y } = getCoordinates(e);
          const ctx = canvasRef.current?.getContext('2d');
          if (ctx) {
            ctx.lineTo(x, y);
            ctx.stroke();
          }
        };

        const stopDrawing = () => {
          if (isDrawing) {
            setIsDrawing(false);
            const canvas = canvasRef.current;
            if (canvas) onSave(canvas.toDataURL());
          }
        };

        const clear = () => {
          const canvas = canvasRef.current;
          const ctx = canvas?.getContext('2d');
          if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            onSave('');
          }
        };

        return (
          <div className="w-full">
            <div className="flex justify-between items-center mb-2">
              <label className="text-sm font-bold text-gray-700 flex items-center gap-2">
                <PenTool className="w-4 h-4" /> {label}

                <Eraser className="w-3 h-3" /> Limpar
              </button>
            </div>
            <div className="border-2 border-dashed border-gray-300 rounded-lg bg-white overflow-hidden touch-none">
              <canvas ref={canvasRef} className="w-full cursor-crosshair"
                onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
              />
            </div>
          </div>
        );
      };

      // Componente: Login
      const Login = ({ onLogin }) => {

                </div>
                <div>

                    className="block w-full p-3 border border-black rounded-none focus:outline-none focus:ring-1 focus:ring-black" required />
                </div>
                {error && <div className="text-black text-xs font-bold border border-black p-2 bg-gray-100 text-center uppercase">{error}</div>}
                <button type="submit" disabled={loading} 
                  className="w-full py-3 bg-black text-white font-bold uppercase hover:bg-gray-800 transition-colors disabled:bg-gray-400">
                  {loading ? 'Verificando...' : 'Entrar'}
                </button>
              </form>
            </div>
          </div>
        );

          if (newPassword !== confirmPassword) return setMessage({ type: 'error', text: 'As senhas não coincidem.' });
          setLoading(true);
          const result = await changePassword(user, oldPassword, newPassword);

            <div className="border-b border-black flex overflow-x-auto no-scrollbar">
              {['inspections', 'users', 'logs'].map(tab => (
                 <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-4 font-bold uppercase text-xs border-b-4 flex-shrink-0 ${activeTab === tab ? 'border-black text-black' : 'border-transparent text-gray-400'}`}>{tab === 'inspections' ? 'Vistorias' : tab === 'users' ? 'Usuários' : 'Logs'}</button>
              ))}
              <button onClick={refreshData} className="ml-auto p-4"><RefreshCw className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} /></button>
            </div>
            <main className="flex-1 overflow-y-auto p-4 sm:p-6">
              {activeTab === 'inspections' && (
                <div className="space-y-4">
                  <div className="flex gap-2 mb-4"><input placeholder="BUSCAR PLACA..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="border border-black p-2 flex-1 text-xs uppercase" /></div>
                  {filteredInspections.map(i => (
                    <div key={i.id} className="border border-black p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                       <div><h3 className="font-bold text-lg">{i.plate}</h3><p className="text-xs uppercase">{i.vehicle}</p></div>
                       <div className="flex gap-2 w-full sm:w-auto">
                         <button onClick={() => generateGlobalPDF(i)} className="bg-black text-white px-3 py-2 sm:py-1 text-xs font-bold uppercase flex-1 sm:flex-none">PDF</button>
                         <button onClick={() => deleteInspection(currentUser, i.id).then(refreshData)} className="border border-black px-3 py-2 sm:py-1 text-xs font-bold uppercase flex-none">X</button>
                       </div>
                    </div>
                  ))}
                </div>
              )}
              {activeTab === 'users' && (
                <div>
                   <button onClick={() => setNewUserOpen(!newUserOpen)} className="bg-black text-white px-4 py-2 text-xs font-bold uppercase mb-4 w-full sm:w-auto">Novo Usuário</button>
                   {newUserOpen && <div className="border border-black p-4 mb-4 bg-gray-50 grid gap-2">
                      <input placeholder="Nome" className="border border-black p-2" onChange={e=>setNewUser({...newUser, name: e.target.value})} />
                      <input placeholder="Usuário (Login)" className="border border-black p-2" onChange={e=>setNewUser({...newUser, username: e.target.value})} />
                      <input placeholder="Senha (Obrigatório)" className="border border-black p-2" required onChange={e=>setNewUser({...newUser, password: e.target.value})} />
                      <button onClick={handleCreateUser} className="bg-black text-white p-2 text-xs font-bold uppercase">Salvar</button>
                   </div>}
                   <div className="overflow-x-auto">
                     <table className="w-full text-left border border-black min-w-[500px]">
                       <thead className="bg-black text-white text-xs uppercase"><tr><th className="p-2">User</th><th className="p-2">Nome</th><th className="p-2">Senha</th><th className="p-2">Role</th><th className="p-2">Action</th></tr></thead>
                       <tbody>{dataState.users.map(u => (
                         <tr key={u.id} className="border-b border-gray-200 text-xs">
                           <td className="p-2 font-bold">{u.username}</td>
                           <td className="p-2">{u.name}</td>
                           <td className="p-2">
                             <div className="flex items-center gap-2">
                               <span className="font-mono">{visiblePasswords[u.id] ? u.password : '••••••'}</span>
                               <button onClick={() => togglePasswordVisibility(u.id)}><Eye className="w-3 h-3 text-gray-500" /></button>
                             </div>
                           </td>
                           <td className="p-2 uppercase">{u.role === 'admin' ? 'ADMIN' : 'FUNC'}</td>
                           <td className="p-2 flex gap-2">
                             <button onClick={() => setSelectedUserProfile(u)} className="bg-gray-100 border border-gray-300 px-2 py-1 font-bold">VER FICHA</button>
                             {u.username !== 'MayconD' && <button onClick={() => handleDeleteUser(u.id)} className="text-red-600 font-bold ml-2">X</button>}
                           </td>
                         </tr>
                       ))}</tbody>
                     </table>
                   </div>
                </div>
              )}
              {activeTab === 'logs' && <div className="border border-black max-h-[500px] overflow-y-auto"><table className="w-full text-xs text-left"><thead className="bg-gray-100 sticky top-0"><tr><th className="p-2">Data</th><th className="p-2">User</th><th className="p-2">Ação</th></tr></thead><tbody>{dataState.logs.map(l => <tr key={l.id} className="border-b"><td className="p-2">{new Date(l.timestamp).toLocaleString()}</td><td className="p-2 font-bold">{l.username}</td><td className="p-2">{l.action}</td></tr>)}</tbody></table></div>}
            </main>
          </div>
        );
      };

      // --- 4. APP PRINCIPAL ---
      
      const App = () => {
        const [currentUser, setCurrentUser] = useState(null);
        const [activeTab, setActiveTab] = useState(0);
        const [data, setData] = useState(INITIAL_DATA);
        const [isSaving, setIsSaving] = useState(false);
        const [showSettings, setShowSettings] = useState(false);

        useEffect(() => {
          const user = getCurrentUser();
          if (user) setCurrentUser(user);
        }, []);

        const updateData = (field, value) => setData(prev => ({ ...prev, [field]: value }));
        const updateNestedData = (parent, key, value) => {
          if (parent === 'fuelLevel') setData(prev => ({ ...prev, fuelLevel: value }));
          else setData(prev => ({ ...prev, [parent]: { ...prev[parent], [key]: value } }));
        };

        const handleSave = async () => {
          if (!currentUser) return;
          setIsSaving(true);
          try {
            await saveInspection(data, currentUser);
            alert("Sucesso!");
            setData(INITIAL_DATA);
            setActiveTab(4);
          } catch (e) { alert("Erro: " + e.message); }
          finally { setIsSaving(false); }
        };

        if (!currentUser) return <Login onLogin={setCurrentUser} />;
        if (currentUser.role === 'admin') return <AdminDashboard currentUser={currentUser} onLogout={() => { logoutUser(); setCurrentUser(null); }} />;

        const tabs = [
          { icon: LayoutDashboard, label: 'Início' }, { icon: ClipboardList, label: 'Quest.' }, 
          { icon: Camera, label: 'Fotos' }, { icon: Save, label: 'Salvar' }, { icon: History, label: 'Hist.' }
        ];

        return (
          <div className="h-full flex flex-col font-sans relative">
            {showSettings && <UserSettings user={currentUser} onClose={() => setShowSettings(false)} />}
            <header className="bg-black text-white p-4 flex justify-between items-center z-20">
              <h1 className="text-sm font-extrabold tracking-widest uppercase truncate max-w-[200px]">{COMPANY_NAME}</h1>
              <div className="flex gap-2">
                 <button onClick={() => setShowSettings(true)} className="border border-white p-1"><Settings className="w-4 h-4" /></button>
                 <button onClick={() => { logoutUser(); setCurrentUser(null); }} className="bg-white text-black p-1"><LogOut className="w-4 h-4" /></button>
              </div>
            </header>
            <main className="flex-1 overflow-y-auto pb-20">
              {activeTab === 0 && <TabInitial data={data} updateData={updateData} updateNestedData={updateNestedData} />}
              {activeTab === 1 && <TabQuestionnaire data={data} updateNestedData={updateNestedData} />}
              {activeTab === 2 && <TabPhotos data={data} updateNestedData={updateNestedData} />}
              {activeTab === 3 && (isSaving ? <div className="p-10 text-center font-bold animate-pulse">SALVANDO...</div> : <TabSave data={data} updateData={updateData} onSave={handleSave} onDiscard={() => setData(INITIAL_DATA)} />)}
              {activeTab === 4 && <TabHistory currentUser={currentUser} onEdit={(insp) => { setData(insp); setActiveTab(0); }} />}
            </main>
            <nav className="fixed bottom-0 w-full bg-white border-t border-black flex justify-around pb-safe z-30">
              {tabs.map((t, i) => {
                const Icon = t.icon;
                return <button key={i} onClick={() => setActiveTab(i)} className={`flex flex-col items-center p-3 w-full ${activeTab === i ? 'bg-gray-100 text-black font-bold' : 'text-gray-400'}`}><Icon className="w-6 h-6 mb-1" /><span className="text-[10px] uppercase">{t.label}</span></button>
              })}
            </nav>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
